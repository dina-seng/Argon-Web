<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Argon — The Apple Wallet Pass (Apple App Store Icon)</title>
  <defs>
    
    <!-- Apple Squircle Clip Path (512x512, rx=115 ≈ 22.4% continuous curve) -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
    <!-- Specular Top-Light Rim Gradient -->
    <linearGradient id="appleRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <!-- Ambient Shadow Under Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Frosted Space Black Background -->
    <radialGradient id="bgGrad2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="50%" stop-color="#0B0F1A" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>
    <!-- Holographic Pass Card Surface -->
    <linearGradient id="ticketFoil2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <!-- Ticket Inner Sheen / Specular Light -->
    <linearGradient id="ticketSheen" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#bgGrad2)" />

    <!-- Ambient Glow behind ticket -->
    <ellipse cx="256" cy="256" rx="150" ry="120" fill="#3B82F6" opacity="0.22" filter="blur(40px)" />

    <!-- Tile Rim -->
    <rect width="512" height="512" fill="none" stroke="url(#appleRimGrad)" stroke-width="2.5" rx="115" ry="115" />

    <!-- Floating Ticket Pass Card -->
    <g filter="url(#emblemShadow)">
      <!-- Main Ticket Body with precision ticket notches (evenodd cutout) -->
      <path fill="url(#ticketFoil2)" fill-rule="evenodd" d="
        M 172 136
        C 152 136 136 152 136 172
        L 136 230
        C 154 230 168 244 168 256
        C 168 268 154 282 136 282
        L 136 340
        C 136 360 152 376 172 376
        L 340 376
        C 360 376 376 360 376 340
        L 376 282
        C 358 282 344 268 344 256
        C 344 244 358 230 376 230
        L 376 172
        C 376 152 360 136 340 136
        Z
      " />

      <!-- Top Specular Gloss Overlay -->
      <path fill="url(#ticketSheen)" fill-rule="evenodd" d="
        M 172 136
        C 152 136 136 152 136 172
        L 136 230
        C 154 230 168 244 168 256
        C 168 268 154 282 136 282
        L 136 340
        C 136 360 152 376 172 376
        L 340 376
        C 360 376 376 360 376 340
        L 376 282
        C 358 282 344 268 344 256
        C 344 244 358 230 376 230
        L 376 172
        C 376 152 360 136 340 136
        Z
      " />

      <!-- Crisp 1px Ticket Perimeter Stroke -->
      <path fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" d="
        M 172 136
        C 152 136 136 152 136 172
        L 136 230
        C 154 230 168 244 168 256
        C 168 268 154 282 136 282
        L 136 340
        C 136 360 152 376 172 376
        L 340 376
        C 360 376 376 360 376 340
        L 376 282
        C 358 282 344 268 344 256
        C 344 244 358 230 376 230
        L 376 172
        C 376 152 360 136 340 136
        Z
      " />

      <!-- Laser-Cut Center Argon Monogram Symbol -->
      <path fill="#090E17" d="
        M 256 182
        C 250 182 245 186 242 192
        L 204 290
        C 201 297 206 306 215 306
        L 230 306
        C 235 306 240 302 242 297
        L 248 280
        L 264 280
        L 270 297
        C 272 302 277 306 282 306
        L 297 306
        C 306 306 311 297 308 290
        L 270 192
        C 267 186 262 182 256 182
        Z
        M 256 222
        L 260 262
        L 252 262
        Z
      " />

      <!-- Cryptographic Hologram Barcode/NFC Dot Matrix at bottom of ticket -->
      <circle cx="216" cy="334" r="3.5" fill="#FFFFFF" opacity="0.6" />
      <circle cx="236" cy="334" r="3.5" fill="#FFFFFF" opacity="0.6" />
      <circle cx="256" cy="334" r="3.5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="276" cy="334" r="3.5" fill="#FFFFFF" opacity="0.6" />
      <circle cx="296" cy="334" r="3.5" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>
</svg>