<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Argon — The Noble Gateway (Apple App Store Icon)</title>
  <defs>
    
    <!-- Apple Squircle Clip Path (512x512, rx=115 ≈ 22.4% continuous curve) -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
    <!-- Specular Top-Light Rim Gradient -->
    <linearGradient id="appleRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <!-- Ambient Shadow Under Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#151926" />
      <stop offset="60%" stop-color="#0C0F17" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#bgGrad3)" />

    <!-- Ambient Core Glow -->
    <circle cx="256" cy="256" r="130" fill="#06B6D4" opacity="0.2" filter="blur(38px)" />
    <circle cx="256" cy="270" r="100" fill="#6366F1" opacity="0.22" filter="blur(42px)" />

    <!-- Tile Rim -->
    <rect width="512" height="512" fill="none" stroke="url(#appleRimGrad)" stroke-width="2.5" rx="115" ry="115" />

    <!-- Emblem Rings & Monogram Gateway -->
    <g filter="url(#emblemShadow)">
      <!-- Outer Noble Orbit Torus -->
      <circle cx="256" cy="256" r="128" fill="none" stroke="url(#ringGrad1)" stroke-width="24" stroke-linecap="round" stroke-dasharray="720 80" />

      <!-- Inner Ascending Chevron / 'A' Gateway -->
      <path d="
        M 194 324
        L 256 186
        L 318 324
      " fill="none" stroke="url(#ringGrad2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Horizontal Luminous Ticket Gate -->
      <line x1="218" y1="284" x2="294" y2="284" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9" />

      <!-- Core Energy Particle -->
      <circle cx="256" cy="186" r="10" fill="#FFFFFF" filter="url(#emblemGlow)" />
    </g>
  </g>
</svg>