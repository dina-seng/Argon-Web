services:
  - type: web
    name: argon-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SCANNER_URL
        sync: false
      - key: PAYMENT_GATEWAY_BASE_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_GATEWAY_SECRET
        sync: false
    healthCheckPath: /health
