name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm run build --workspace=packages/shared
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argon
          POSTGRES_PASSWORD: argon_test_secret
          POSTGRES_DB: argon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argon -d argon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://argon:argon_test_secret@localhost:5432/argon_test' }}
      REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_not_real_must_be_32_chars_min' }}
      JWT_EXPIRES_IN: 1h
      QR_SIGNING_SECRET: ${{ secrets.QR_SIGNING_SECRET || 'ci_test_qr_secret_not_real_must_be_32_chars_min' }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET || 'argon_webhook_secret_dev' }}
      CLIENT_URL: http://localhost:5173
      SCANNER_URL: http://localhost:5174
      PAYMENT_GATEWAY_BASE_URL: https://sandbox.payment-gateway.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm run build
